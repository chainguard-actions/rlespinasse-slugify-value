name: Test git ref slugification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          key: GITHUB_REF
          value: "refs/heads/feature/my-feature-branch"
      - name: Assert value output
        env:
          ACTUAL: ${{ steps.action.outputs.value }}
        run: |
          echo "actual value: $ACTUAL"
          if [ "$ACTUAL" != "refs/heads/feature/my-feature-branch" ]; then
            echo "FAIL: expected 'refs/heads/feature/my-feature-branch' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: value output correct"
      - name: Assert slug strips refs prefix and lowercases
        env:
          ACTUAL: ${{ steps.action.outputs.slug }}
        run: |
          echo "actual slug: $ACTUAL"
          # refs/heads/ prefix is stripped, slashes replaced with hyphens
          if [ "$ACTUAL" != "feature-my-feature-branch" ]; then
            echo "FAIL: expected 'feature-my-feature-branch' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: slug output correct"
      - name: Assert slug-url strips refs prefix
        env:
          ACTUAL: ${{ steps.action.outputs.slug-url }}
        run: |
          echo "actual slug-url: $ACTUAL"
          if [ "$ACTUAL" != "feature-my-feature-branch" ]; then
            echo "FAIL: expected 'feature-my-feature-branch' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: slug-url output correct"
